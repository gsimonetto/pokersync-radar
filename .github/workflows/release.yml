name: Release

# Gera os instaladores do Radar PokerSync por SO e publica como GitHub
# Release oficial (a "latest", que o auto-update e o botão de download do
# site usam) com os instaladores, as assinaturas e o latest.json. Sem a
# chave de assinatura cadastrada nos secrets, sai tudo menos as assinaturas
# e o latest.json (ver o passo "Confere a chave" e TAURI_UPDATER_SETUP.md).
#
# Disparo manual (Actions -> Release -> Run workflow): usa a versão que
# estiver commitada em src-tauri/tauri.conf.json (bom pra builds de teste).
# Disparo por push de tag "vX.Y.Z": a versão do bundle é sincronizada com a
# tag antes do build, então "git tag v0.2.0 && git push --tags" já gera a
# release certa sem precisar editar tauri.conf.json antes.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Instala dependências do Linux (WebKitGTK)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instala Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do cargo
        uses: Swatinem/rust-cache@v2

      # Só quando disparado por push de tag "vX.Y.Z" — sincroniza a versão
      # do bundle com a tag, em vez de sempre usar o que está commitado em
      # tauri.conf.json (que é o que acontece num disparo manual/teste).
      - name: Versiona pela tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          echo "Versão do bundle: $VERSION"

      # Sem a chave de assinatura nos secrets, o Tauri não consegue assinar
      # os arquivos de atualização e o build inteiro falhava ("Missing
      # comment in secret key") — nenhum instalador saía. Agora os
      # instaladores saem normalmente, só sem os arquivos de atualização
      # automática (.sig + latest.json), e o resumo da execução avisa.
      # Edita o JSON com node (a tauri-action já depende dele nos 3
      # sistemas), não com jq.
      - name: Confere a chave de assinatura das atualizações
        id: chave
        shell: bash
        env:
          CHAVE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$CHAVE" ]; then
            echo "assinar=true" >> "$GITHUB_OUTPUT"
          else
            echo "assinar=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY não cadastrado: instaladores gerados sem os arquivos de atualização (.sig/latest.json) — quem já tem o Radar não recebe esta versão sozinho. Ver TAURI_UPDATER_SETUP.md."
            node -e '
              const fs = require("fs");
              const arquivo = "src-tauri/tauri.conf.json";
              const conf = JSON.parse(fs.readFileSync(arquivo, "utf8"));
              conf.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(arquivo, JSON.stringify(conf, null, 2) + "\n");
            '
          fi

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assina os artefatos de auto-update (arquivo .sig por
          # instalador + latest.json) -- sem isso o updater não confia
          # em nenhuma versão. Secrets cadastrados manualmente em
          # Settings > Secrets and variables > Actions (ver
          # TAURI_UPDATER_SETUP.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Radar PokerSync v__VERSION__"
          releaseBody: |
            Nova versão do Radar PokerSync.

            Quem já tem o Radar 0.2.0 ou mais novo recebe esta versão sozinho (aparece "Nova versão disponível" na tela do Radar).
            Pra instalar pela primeira vez, use o botão "Baixar" na página do Radar em pokersync.com.br.
          # Publicada de verdade (não-draft, não-prerelease): o
          # auto-update olha pra release "latest" do repositório, então
          # uma tag vX.Y.Z já entrega a atualização pros usuários assim
          # que o build termina.
          releaseDraft: false
          prerelease: false
          # O botão de download do site entrega o instalador .exe (NSIS);
          # a atualização automática tem que usar o mesmo tipo, senão o
          # Windows acaba com duas instalações (uma .exe e uma .msi).
          updaterJsonPreferNsis: true
          # latest.json só com assinatura (ver "Confere a chave" acima).
          includeUpdaterJson: ${{ steps.chave.outputs.assinar == 'true' }}

      # Cópia de cada instalador com nome FIXO (sem número de versão) — o
      # botão "Baixar" do site aponta pra
      # releases/latest/download/Radar-PokerSync-<SO>.<ext>, que nunca muda
      # de uma versão pra outra. Antes o site mandava pra página do GitHub,
      # com 7 arquivos e nome antigo.
      - name: Publica instalador com nome fixo pro botão de download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.tauri.outputs.appVersion }}
        run: |
          case "${{ matrix.platform }}" in
            windows-latest) ORIGEM=$(find target -path '*/bundle/nsis/*-setup.exe' | head -1); DESTINO=Radar-PokerSync-Windows.exe ;;
            macos-latest)   ORIGEM=$(find target -path '*/bundle/dmg/*.dmg' | head -1);        DESTINO=Radar-PokerSync-Mac.dmg ;;
            *)              ORIGEM=$(find target -path '*/bundle/appimage/*.AppImage' | head -1); DESTINO=Radar-PokerSync-Linux.AppImage ;;
          esac
          if [ -z "$ORIGEM" ]; then echo "Instalador não encontrado"; exit 1; fi
          cp "$ORIGEM" "$DESTINO"
          gh release upload "$TAG" "$DESTINO" --clobber --repo "$GITHUB_REPOSITORY"
