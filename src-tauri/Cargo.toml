[package]
name = "pokersync-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pokersync_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
scanner = { path = "../crates/scanner" }
sync-client = { path = "../crates/sync-client" }
# rustls-tls-native-roots (não rustls-tls puro): "rustls-tls" confia só
# nas raízes públicas embutidas no binário (webpki-roots) e ignora o
# repositório de certificados do Windows/macOS/Linux -- então numa rede
# com inspeção SSL (proxy corporativo, antivírus com "escaneamento
# HTTPS" tipo Kaspersky/ESET) o navegador confia na raiz que o SO/o
# programa de segurança instalou e o agente não, e todo POST a
# SUPABASE_URL cai fora sem nem chegar no servidor -- exatamente o caso
# relatado de "erro de http" só no login por senha do agente, nunca
# pelo site. Com native-roots o reqwest também aceita as raízes que
# estão instaladas no SO, igual o navegador.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rand = "0.8"
url = "2"
base64 = "0.22"
